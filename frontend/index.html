<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport"
 content="width=device-width, initial-scale=1.0">
 <title>SAEPChef2</title>
 <link rel="stylesheet" href="style.css">
</head>
<!-- Os módulos serão colocados aqui. -->
<body>
    <header class="cabecalho">
        <section class="usuario-cabecalho">
            <img id="fotoUsuario"
            src="anexos_prova/imagens_usuarios/saepChef.jpg"
            alt="Foto do usuário">
                <div>
                    <strong id="nomeUsuario">@SAEPChef</strong>
                        <button id="botaoPerfil"
                        class="botao botao-escuro">
                        Ver Perfil
                        </button>
                </div>
        </section>
        <a class="marca" href="#">SAEPChef</a>
        <button id="botaoLogin"
        class="botao botao-escuro">
        Login
        </button>
    </header>
    <!--main-->
    <main class="conteudo">
        <form id="formBusca" class="busca">
            <input id="campoBusca"
            type="search"
            placeholder="Digite o nome do chef... ex: @chef1">
            <button type="submit" aria-label="Buscar chef">
            <img src="anexos_prova/icones/lupa.svg" alt="">
            </button>
        </form>
        <p id="mensagemBusca" class="mensagem-busca"></p>
        <section id="secaoMural">
            <div id="muralReceitas" class="mural"></div>
        </section>
    </main>
    <aside id="painelPerfil" class="painel-perfil">
        <button id="fecharPerfil" class="botao-icone">
        <img src="anexos_prova/icones/close.svg" alt="Fechar">
        </button>
        <img id="fotoPerfil" class="foto-perfil"
        alt="Foto do chef">
        <h2 id="nomePerfil"></h2>
        <div class="numeros-perfil">
        <p>
        <strong id="totalFavoritos">0</strong>
        <span>Favoritos</span>
        </p>
        <p>
        <strong id="totalReceitas">0</strong>
        <span>Receitas</span>
        </p>
        </div>
        <button id="botaoSuasReceitas"
        class="suas-receitas">
        Suas receitas
        </button>
    </aside>
    <!--footer-->
    <footer class="rodape">
        
        <nav class="redes" aria-label="Redes sociais">
            <a href="#" aria-label="Instagram">
                <img src="anexos_prova/icones/instagram.svg" alt="">
            </a>
            <a href="#" aria-label="TikTok">
                <img src="anexos_prova/icones/tiktok.svg" alt="">
            </a>
            <a href="#" aria-label="LinkedIn">
              <img src="anexos_prova/icones/linkedin.svg" alt="">
            </a>
            <a href="#" aria-label="YouTube">
                <img src="anexos_prova/icones/youtube.svg" alt="">
            </a>
        </nav>
        <span>Copyright 2026-2027</span>
    </footer>
   <div id="modal-login" class="modal">
  <div class="modal-content">

    <!-- BOTÃO X -->
     <button id="fecharLogin" class="botao-icone">
                <img src="anexos_prova/icones/close.svg"
                alt="Fechar login" class="img-modal">
            </button>
    <h2 class="titulo">Login</h2>
    <hr/>
    <label>Email</label>
    <input id="loginEmail" type="text" placeholder="Digite seu email" required>
    <label>Senha</label>
    <input id="loginSenha" type="password" placeholder="Digite sua senha" required>

    <button class="logar" onclick="fazerLogin()">Login</button>
    <button class="cancelar"onclick="fecharModal()">Cancelar</button>

    <p id="erroLogin"></p>
  </div>
</div>

 <script src="script.js"></script>
</body>
</html>
